name: Build SkyCastPro Next
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Pure Java forecast tests
        run: bash tools/run-core-tests.sh
      - name: Provider regression tests
        run: |
          mkdir -p build/test-deps
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o build/test-deps/json.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/jsoup/jsoup/1.24.1/jsoup-1.24.1.jar -o build/test-deps/jsoup.jar
          bash tools/run-provider-tests.sh "$PWD/build/test-deps/json.jar" "$PWD/build/test-deps/jsoup.jar"
      - name: Lint and compile debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Verify compiled APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -12
      - uses: actions/upload-artifact@v4
        with:
          name: SkyCastPro-Next-v2.0.0-alpha.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
